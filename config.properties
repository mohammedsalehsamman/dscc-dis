# where the Library RMI server runs (clients)
rmi.host=localhost
rmi.port=1099

# library rules (RMI server)
loan.days=14
loan.maxPerStudent=5
loan.maxRenewals=2
fine.perDay=500
overdue.checkSeconds=60
